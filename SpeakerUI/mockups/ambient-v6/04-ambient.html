.ambient-assistant[data-state=listening]:not([data-muted=true]) .state-edge{background:linear-gradient(90deg,#e9f7fa3b,transparent 9%,transparent 91%,#e9f7fa3b),linear-gradient(#e9f7fa30,transparent 14%,transparent 86%,#e9f7fa30);animation:listening-soft-flash 2.6s ease-in-out infinite}
@keyframes listening-soft-flash{0%,100%{opacity:.4}36%{opacity:.9}56%{opacity:.55}72%{opacity:.78}}
.ambient-assistant .attention-edge{background:linear-gradient(90deg,#effaff88,transparent 15%,transparent 85%,#effaff88),linear-gradient(#effaff88,transparent 18%,transparent 82%,#effaff88);animation:alert-signal 3.6s ease-in-out infinite}
@keyframes alert-signal{0%,18%{opacity:1}22%,27%{opacity:.04}30%,34%{opacity:1}37%,41%{opacity:.04}44%,48%{opacity:1}52%,100%{opacity:.04}}
.ambient-assistant .reminder-widget .reminder-done-action{left:var(--swipe-label-x,18px);right:0;width:auto;padding-left:0;white-space:nowrap;clip-path:inset(0 max(0px,calc(100% - var(--swipe-reveal,0px))) 0 0)}
.ambient-assistant .clock-center{gap:0}
.ambient-assistant [data-date]{position:absolute;top:calc(100% + 10px);left:0;right:0;text-align:center;white-space:nowrap}
.ambient-assistant .environment-line{position:absolute;top:calc(100% + 33px);left:50%;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;gap:10px;white-space:nowrap;font-size:11px;color:#a8bcc4;line-height:18px}
.ambient-assistant .home-temperature{display:flex;align-items:baseline;gap:3px}
.ambient-assistant .home-temperature strong{font-size:14px;font-weight:400;line-height:18px;color:#c6d7dc}
.ambient-assistant .home-temperature sup{position:relative;align-self:flex-start;top:-1px;height:12px;line-height:1}
.ambient-assistant .home-temperature sup svg{width:8px;height:11px;stroke-width:1.5}
.ambient-assistant .environment-divider{height:11px;width:1px;background:#a9c2ca40}
.ambient-assistant .home-weather{display:flex;align-items:center;gap:6px}
.ambient-assistant .home-weather svg{width:15px;height:15px;color:#bfd1d5}
.ambient-assistant .agent-state{top:calc(50% + 104px)}
.ambient-assistant[data-view=climate] .thermostat{transform:translateY(-18px)}
.ambient-assistant .sensor-source{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);width:270px;z-index:4;display:grid;grid-template-columns:auto 1fr;gap:3px 12px;align-items:center}
.ambient-assistant .sensor-source label{font-size:11px;color:#879da6}
.ambient-assistant .sensor-source select{font-size:12px;min-height:44px;padding:7px 4px;color:#bdcfd5;background:none;border:0;border-bottom:1px solid #c9e4e322;border-radius:0;min-width:0;width:100%;outline-offset:3px}
.ambient-assistant .sensor-source small{grid-column:1/-1;justify-self:center;font:10px/1.4 ui-monospace,monospace;color:#657e89;user-select:text}
.ambient-assistant .sensor-source option{background:#14212a;color:#dbe8ec}
.ambient-assistant .thermostat[data-thermal=unavailable] .dial-active{opacity:0}
@container(min-height:560px){.ambient-assistant .sensor-source{bottom:36px}}
@media(prefers-reduced-motion:reduce){.ambient-assistant .attention-edge{animation:none!important;opacity:.6}.ambient-assistant .state-edge{animation:none!important}}

/* Direct manipulation owns the wheel gesture; native wheel/keyboard scroll still works. */
.ambient-assistant .alarm-wheel,.ambient-assistant .wheel-value{touch-action:none}
.ambient-assistant .alarm-wheel{cursor:grab}
.ambient-assistant .alarm-wheel.wheel-dragging{scroll-snap-type:none;cursor:grabbing}
.ambient-assistant .wheel-value{cursor:inherit}

/* Soft, rounded four-edge light; only compositor opacity animates. */
.ambient-assistant .state-edge,.ambient-assistant .attention-edge{inset:3px;border-radius:24px}
.ambient-assistant[data-state=listening]:not([data-muted=true]) .state-edge{background:none;box-shadow:inset 0 0 32px 5px #e9f7fa66,inset 0 0 2px #f4fbff8c}
.ambient-assistant[data-muted=true] .state-edge{background:none;box-shadow:inset 0 0 34px 6px #ed454670,inset 0 0 2px #ed45468c}
.ambient-assistant .attention-edge{background:none;box-shadow:inset 0 0 44px 8px #effaffaa,inset 0 0 2px 1px #f4fbff99}
.ambient-assistant .screen-countdown path{stroke-linejoin:round;stroke-linecap:round}
