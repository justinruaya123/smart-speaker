# Iris release entry point: python train.py (root environment).
# Frozen experimental schedules live in experiments/iris-release-v1/protocol.json.
# Installation settings live in config.toml, created from config.example.toml.
[release]
experiment = "iris-release-v1"
protocol = "experiments/iris-release-v1/protocol.json"
inputs = "experiments/iris-release-v1/reproduction-inputs.json"
selection = "experiments/iris-release-v1/reproduction-release.json"
profile = "owner-protected"
qualified = false

[runtime]
sample_rate = 16000
threads = 1
engine = "ncnn"
no_transcription = true
no_remote_inference = true
