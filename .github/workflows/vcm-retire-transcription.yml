name: Remove independent transcription and verify VCM-only packaging
on:
  push:
    branches: [research/vcm-final-suite-visualizer]
    paths: [tools/retire_asr.py, tests/test_vcm_only.py, .github/workflows/vcm-retire-transcription.yml]
permissions:
  contents: write
concurrency:
  group: vcm-only-migration
  cancel-in-progress: false
jobs:
  verify-and-record:
    if: github.ref == 'refs/heads/research/vcm-final-suite-visualizer'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/vcm-final-suite-visualizer
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies, no pretrained weights
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          python -m pip install numpy==2.3.5 scipy==1.16.3 einops==0.8.1 soundfile==0.13.1 onnx==1.20.0 onnxruntime==1.23.2 pytest==8.4.2
      - name: Apply reviewed migration and run actual ONNX fixture checks
        run: |
          python tools/retire_asr.py
          python tools/retire_asr.py
          python -m pytest -q tests/test_vcm_only.py final_suite/tests/test_review.py final_suite/tests/test_restore.py
      - name: Commit only the reviewed root pipeline paths
        run: |
          git add Architecture.ipynb pipeline.toml train.py publish.py validation.json artifacts/bundle.json artifacts/manifest.json artifacts/training-config.json data/dataset.json
          git add -u -- artifacts/asr-training-config.json
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: remove independent transcription from runtime training and Pi bundle'
          git push origin HEAD:research/vcm-final-suite-visualizer
      - name: Archive exact verified root source
        run: git archive --format=zip HEAD -o vcm-only-verified-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: vcm-only-verified-source
          path: vcm-only-verified-source.zip
          retention-days: 7
