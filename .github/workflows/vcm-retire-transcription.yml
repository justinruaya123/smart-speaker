name: VCM-only runtime and packaging contracts
on:
  push:
    branches: [research/vcm-final-suite-visualizer]
  pull_request:
permissions:
  contents: read
concurrency:
  group: vcm-only-contracts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install CPU test libraries, not model weights
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          python -m pip install numpy==2.3.5 scipy==1.16.3 einops==0.8.1 soundfile==0.13.1 onnx==1.20.0 onnxruntime==1.23.2 pytest==8.4.2
      - name: Check VCM-only graph export and publisher allowlist
        run: |
          python -m pytest -q tests/test_vcm_only.py tests/test_optionb_audit.py tests/test_grammar_extension.py final_suite/tests/test_review.py final_suite/tests/test_restore.py
      - name: Archive verified source (not acoustic qualification)
        run: git archive --format=zip HEAD -o vcm-only-verified-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: vcm-only-verified-source
          path: vcm-only-verified-source.zip
          if-no-files-found: error
          retention-days: 7
