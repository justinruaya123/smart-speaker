name: VCM source contracts (not acoustic qualification)
on:
  push:
    branches: [research/vcm-final-suite-visualizer]
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest -q final_suite/tests/test_review.py final_suite/tests/test_restore.py final_suite/tests/test_run_all_repo_only.py tests/test_checkpoint_selection.py tests/test_bootstrap_semifinal.py
      - run: python scripts/bootstrap_semifinal.py --profile core > bootstrap-plan.json
      - run: test ! -e data/raw
      - run: echo 'Source contracts only. Full payload, acoustic, browser and Pi qualification are separate.'
      - uses: actions/upload-artifact@v4
        with:
          name: vcm-research-source
          path: |
            visualizer/
            final_suite/
            VCM_Final_Review.ipynb
            FINAL_REVIEW.md
          if-no-files-found: error
          retention-days: 7
