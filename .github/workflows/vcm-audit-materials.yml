name: VCM audit materials (no model execution)
on:
  push:
    branches: [research/vcm-final-suite-visualizer]
    paths: [.github/workflows/vcm-audit-materials.yml]
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Archive tracked source and inspect public reference without executing it
        run: |
          mkdir -p audit-materials/reference audit-materials/wheels
          git archive --format=zip HEAD -o audit-materials/current-source.zip
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.parse import quote
          root = Path('audit-materials/reference')
          base = 'https://api.github.com/repos/markandrian30/AI231/'
          def get(url):
              with urlopen(Request(url, headers={'User-Agent': 'VCM-source-audit'}), timeout=60) as response:
                  return response.read()
          head = json.loads(get(base + 'commits/main'))['sha']
          parent = json.loads(get(base + 'contents/MEX2?ref=' + head))
          subtree = next(x['sha'] for x in parent if x['name'] == 'OptionB')
          tree = json.loads(get(base + 'git/trees/' + subtree + '?recursive=1'))
          if tree.get('truncated'):
              raise RuntimeError('Truncated reference tree')
          (root / 'tree.json').write_text(json.dumps(tree, indent=2))
          ledger = {'repository': 'markandrian30/AI231', 'commit': head, 'subtree': subtree, 'files': []}
          for entry in tree['tree']:
              path = Path(entry['path'])
              if entry['type'] != 'blob' or path.suffix.lower() not in {'.py', '.ipynb', '.md', '.txt', '.json', '.csv'} or entry.get('size', 0) > 5000000:
                  continue
              url = 'https://raw.githubusercontent.com/markandrian30/AI231/' + head + '/MEX2/OptionB/' + quote(entry['path'])
              content = get(url)
              destination = root / path
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(content)
              ledger['files'].append({'path': entry['path'], 'sha256': hashlib.sha256(content).hexdigest(), 'bytes': len(content)})
          (root / 'provenance.json').write_text(json.dumps(ledger, indent=2))
          print(json.dumps(ledger, indent=2))
          PY
      - name: Download pinned CPU inference libraries, not model weights
        run: |
          python -m pip download --only-binary=:all: --dest audit-materials/wheels onnx==1.20.0 onnxruntime==1.23.2
      - uses: actions/upload-artifact@v4
        with:
          name: vcm-audit-materials
          path: audit-materials/
          if-no-files-found: error
          retention-days: 7
