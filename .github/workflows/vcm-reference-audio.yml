name: Option B bounded audio audit
on:
  push:
    branches: [research/vcm-final-suite-visualizer]
    paths: [.github/workflows/vcm-reference-audio.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fetch pinned WAV subset; do not execute reference code
        run: |
          python - <<'PY'
          import csv
          import hashlib
          import io
          import json
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen
          revision = 'ed245708c2573188eb769096aba76588f79b8de1'
          base = 'https://raw.githubusercontent.com/markandrian30/AI231/' + revision + '/MEX2/OptionB/'
          root = Path('optionb-audio'); root.mkdir()
          def get(url):
              with urlopen(Request(url, headers={'User-Agent': 'VCM-dataset-audit'}), timeout=60) as stream:
                  return stream.read()
          manifest = get(base + 'manifest.csv')
          rows = list(csv.DictReader(io.StringIO(manifest.decode())))
          selected = [row for row in rows if row['intent'] == 'BRIGHTNESS']
          for label in sorted({row['label'] for row in rows if row['intent'] != 'BRIGHTNESS'}):
              selected.extend(sorted((r for r in rows if r['label'] == label), key=lambda r: r['path'])[:2])
          if len(selected) > 2500:
              raise ValueError('Bounded audit size exceeded')
          def fetch(row):
              content = get(base + quote(row['path']))
              if len(content) > 2000000:
                  raise ValueError('Unexpected recording size')
              path = root / row['path']; path.parent.mkdir(parents=True, exist_ok=True); path.write_bytes(content)
              return {**row, 'file_sha256': hashlib.sha256(content).hexdigest(), 'git_blob_sha': hashlib.sha1(b'blob ' + str(len(content)).encode() + b'\0' + content).hexdigest(), 'bytes': len(content)}
          with ThreadPoolExecutor(max_workers=8) as pool:
              records = list(pool.map(fetch, selected))
          (root / 'manifest.json').write_text(json.dumps({'repository': 'markandrian30/AI231', 'commit': revision, 'source_manifest_sha256': hashlib.sha256(manifest).hexdigest(), 'records': records}, indent=2))
          print('Fetched', len(records), 'recordings; no training or playback was performed')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: optionb-audio-audit
          path: optionb-audio/
          if-no-files-found: error
          retention-days: 1
