[project]
name = "iris-epoch44-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "cffi==2.1.1",
  "einops==0.8.2",
  "flatbuffers==25.12.19",
  "numpy==2.5.3",
  "onnxruntime==1.30.0",
  "packaging==26.3",
  "protobuf==7.36.1",
  "pycparser==3.0",
  "soundfile==0.14.0",
  "typing-extensions==4.16.0",
]

[project.optional-dependencies]
audio = ["sounddevice==0.5.6"]
benchmark = ["pyarrow==23.0.1"]

[tool.uv]
package = false
