# Editable installation settings. Restart start.py after changing these values.
# Environment / root .env overrides these values; explicit CLI options win.
[inference]
engine = "ncnn" # Or "onnxruntime"; no automatic engine fallback.
mode = "demo" # Live microphone execution; "qualified" follows frozen policy.
intent_threshold = 0.95
slot_threshold = 0.90 # Every supplied slot must pass independently.
threads = 1

[audio]
microphone = -1 # -1 waits for explicit selection in Debug > Inference.

[server]
host = "127.0.0.1"
port = 3000
origin = "" # Derived from host/port when empty.

[ui]
debug = true
readout = true

[actions]
enabled = true

[benchmark]
cpu = 0
output = "results"

[providers]
ha_enabled = false
ha_url = ""
ha_entity_ids = "" # Comma-separated allowed provider entity IDs.
spotify_enabled = false
spotify_redirect_uri = ""
spotify_device_id = ""
local_media_dir = "media"
data_dir = "data"

[bindings.lights]
# "light.kitchen" = "light.your_kitchen_entity"
# "light.all" = "light.your_explicit_group_entity"

[bindings.songs]
# "song.dynamite" = "spotify:track:YOUR_TRACK_ID"
