[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyvcm"
version = "0.1.0"
description = "Independent acoustic voice commands and parameter speech recognition"
requires-python = ">=3.11"
dependencies = ["numpy>=2", "scipy>=1.14", "einops>=0.8", "soundfile>=0.13", "sounddevice>=0.5", "onnxruntime>=1.20"]

[project.optional-dependencies]
train = ["torch>=2.6", "onnx>=1.17", "onnxscript>=0.3", "pytest>=8", "pyarrow>=18"]
report = ["nbformat>=5.10", "nbclient>=0.10", "ipykernel>=6", "matplotlib>=3.9"]

[project.scripts]
tinyvcm = "tinyvcm.cli:main"

[tool.setuptools.packages.find]
include = ["tinyvcm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
