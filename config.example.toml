# Iris installation settings. Restart start.py after changes.
# CLI > environment > private .env > config.toml > defaults.
[inference]
engine = "ncnn" # Explicit alternative: onnxruntime. No automatic fallback.
mode = "demo" # Experimental empirical policy; not human/Pi qualification.
profile = "owner-protected"
threads = 1

[audio]
microphone = -1 # Choose an input listed by --list-mics or the UI.

[server]
host = "127.0.0.1"
port = 3000
origin = ""

[ui]
debug = false
readout = false

[actions]
enabled = true

[benchmark]
cpu = 0
output = "results"

[providers]
ha_enabled = false
ha_url = ""
ha_entity_ids = "" # Explicit allowlist: every bound entity must appear here.
local_media_dir = "media"
data_dir = "state"
timezone = "Asia/Manila"

[bindings.lights]
# "light.ceiling" = "light.your_ceiling"
# "light.all" = ["light.your_ceiling", "light.your_kitchen"]
[bindings.songs]
# "song.enemy" = "media-source://media_source/local/enemy.mp3"
[bindings.climate]
# default = "climate.your_room"
[bindings.weather]
# default = "weather.home"
[bindings.media_player]
# Leave media unconfigured until you select a provider and its required binding.
# provider = "home_assistant" # Explicit alternatives: local, spotify.
# entity_id = "media_player.your_speaker"
[bindings.contacts]
